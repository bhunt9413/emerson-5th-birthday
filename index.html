<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f">
<title>Emerson's Golden Birthday Invitation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#17376a 0,#081a38 42%,#030a16 100%);color:#fff;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}.wrap{width:min(92vw,430px);text-align:center}.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#e7bd4b;margin:0 0 8px}.title{font-size:clamp(1.25rem,5vw,1.65rem);margin:0 0 16px}.scene{position:relative;width:100%;aspect-ratio:1042/1472;perspective:1600px;cursor:pointer;touch-action:manipulation;outline:none;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#fff;transition:transform .75s cubic-bezier(.2,.75,.25,1),opacity .1s linear .32s;backface-visibility:hidden;-webkit-backface-visibility:hidden}.face img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}.front{transform:rotateY(0deg);opacity:1}.back{transform:rotateY(-180deg);opacity:0}.scene.flipped .front{transform:rotateY(180deg);opacity:0}.scene.flipped .back{transform:rotateY(0deg);opacity:1}.hint{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:9px 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);font-size:.9rem;color:#f5f7fb;backdrop-filter:blur(8px)}.hint span{font-size:1.05rem}.sub{margin:10px auto 0;font-size:.75rem;line-height:1.35;color:#aab8d0;max-width:360px}@media(prefers-reduced-motion:reduce){.face{transition:none}}
</style>
</head>
<body><main class="wrap"><p class="eyebrow">You're invited</p><h1 class="title">Emerson's Golden Birthday</h1><div class="scene" id="invite" role="button" tabindex="0" aria-label="Birthday invitation. Tap to flip between front and back." aria-pressed="false"><div class="face front"><img src="front.jpg" alt="Front of Emerson's Gold Star birthday membership invitation"></div><div class="face back"><img src="back.jpg" alt="Back of Emerson's birthday invitation with party details"></div></div><div class="hint"><span>↻</span><span id="hintText">Tap card to flip for party details</span></div><p class="sub">Tap again to return to the membership card.</p></main><script>const scene=document.getElementById('invite'),hint=document.getElementById('hintText');function flip(){const f=scene.classList.toggle('flipped');scene.setAttribute('aria-pressed',String(f));hint.textContent=f?'Tap card to flip back':'Tap card to flip for party details'}scene.addEventListener('click',flip);scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});</script></body></html>
