<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f">
<title>Emerson's Golden Birthday Invitation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#17376a 0,#081a38 42%,#030a16 100%);color:#fff;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}.wrap{position:relative;z-index:2;width:min(92vw,430px);text-align:center}.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#e7bd4b;margin:0 0 8px}.title{font-size:clamp(1.25rem,5vw,1.65rem);margin:0 0 16px}.scene{position:relative;width:100%;aspect-ratio:1042/1472;perspective:1600px;cursor:pointer;touch-action:manipulation;outline:none;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#fff;transition:transform .75s cubic-bezier(.2,.75,.25,1),opacity .1s linear .32s;backface-visibility:hidden;-webkit-backface-visibility:hidden}.face img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}.front{transform:rotateY(0deg);opacity:1}.back{transform:rotateY(-180deg);opacity:0}.scene.flipped .front{transform:rotateY(180deg);opacity:0}.scene.flipped .back{transform:rotateY(0deg);opacity:1}.hint{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:9px 14px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);font-size:.9rem;color:#f5f7fb;backdrop-filter:blur(8px)}.hint span{font-size:1.05rem}.sub{margin:10px auto 0;font-size:.75rem;line-height:1.35;color:#aab8d0;max-width:360px}.balloon{position:absolute;bottom:-160px;width:54px;height:68px;border-radius:52% 48% 48% 52%/58% 58% 42% 42%;opacity:.82;filter:drop-shadow(0 5px 5px rgba(0,0,0,.18));animation:floatUp var(--dur) linear var(--delay) infinite;transform:translateX(0)}.balloon:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid currentColor}.balloon:before{content:"";position:absolute;left:50%;top:100%;width:1px;height:90px;background:rgba(255,255,255,.42);transform-origin:top;animation:stringSway 2.8s ease-in-out infinite alternate}.gold{background:linear-gradient(135deg,#fff0a0 0,#d6a21d 35%,#fff1a5 58%,#a66b00 100%);color:#c99110}.red{background:linear-gradient(135deg,#ff5b65,#d7091c 62%,#8d0010);color:#c30b1c}.blue{background:linear-gradient(135deg,#67b7ff,#1355a5 62%,#072d68);color:#164f9c}.confetti{position:absolute;top:-30px;width:9px;height:15px;border-radius:2px;opacity:.95;animation:confettiFall var(--dur) linear var(--delay) infinite}.confetti:nth-child(3n){background:#e1b12c}.confetti:nth-child(3n+1){background:#e31837}.confetti:nth-child(3n+2){background:#1662ad}.burst{animation-name:confettiBurst;animation-iteration-count:1}@keyframes floatUp{0%{transform:translate3d(0,0,0) rotate(-4deg)}50%{transform:translate3d(var(--drift),-60vh,0) rotate(5deg)}100%{transform:translate3d(calc(var(--drift) * -.5),-125vh,0) rotate(-4deg)}}@keyframes stringSway{to{transform:translateX(-50%) rotate(5deg)}}@keyframes confettiFall{0%{transform:translate3d(0,-5vh,0) rotate(0)}100%{transform:translate3d(var(--drift),110vh,0) rotate(760deg)}}@keyframes confettiBurst{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}100%{transform:translate3d(var(--drift),105vh,0) rotate(900deg);opacity:.15}}@media(prefers-reduced-motion:reduce){.face{transition:none}.fx{display:none}}
</style>
</head>
<body><div class="fx" id="fx" aria-hidden="true"></div><main class="wrap"><p class="eyebrow">You're invited</p><h1 class="title">Emerson's Golden Birthday</h1><div class="scene" id="invite" role="button" tabindex="0" aria-label="Birthday invitation. Tap to flip between front and back." aria-pressed="false"><div class="face front"><img src="front.jpg" alt="Front of Emerson's Gold Star birthday membership invitation"></div><div class="face back"><img src="back.jpg" alt="Back of Emerson's birthday invitation with party details"></div></div><div class="hint"><span>↻</span><span id="hintText">Tap card to flip for party details</span></div><p class="sub">Tap again to return to the membership card.</p></main><script>const scene=document.getElementById('invite'),hint=document.getElementById('hintText'),fx=document.getElementById('fx');function flip(){const f=scene.classList.toggle('flipped');scene.setAttribute('aria-pressed',String(f));hint.textContent=f?'Tap card to flip back':'Tap card to flip for party details'}function partyFX(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['gold','gold','red','blue'];for(let i=0;i<10;i++){const b=document.createElement('i');b.className='balloon '+colors[i%colors.length];b.style.left=(2+Math.random()*92)+'%';b.style.setProperty('--dur',(11+Math.random()*8)+'s');b.style.setProperty('--delay',(-Math.random()*18)+'s');b.style.setProperty('--drift',(-70+Math.random()*140)+'px');b.style.transform='scale('+(0.65+Math.random()*.55)+')';fx.appendChild(b)}for(let i=0;i<54;i++){const c=document.createElement('i');c.className='confetti'+(i<24?' burst':'');c.style.left=(Math.random()*100)+'%';c.style.setProperty('--dur',((i<24?3.5:6)+Math.random()*(i<24?2.5:5))+'s');c.style.setProperty('--delay',i<24?(Math.random()*.7)+'s':(-Math.random()*10)+'s');c.style.setProperty('--drift',(-100+Math.random()*200)+'px');c.style.width=(5+Math.random()*7)+'px';c.style.height=(8+Math.random()*10)+'px';fx.appendChild(c)}}partyFX();scene.addEventListener('click',flip);scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});</script></body></html>
